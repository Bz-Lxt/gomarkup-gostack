services:
  netstack:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gostack-netstack
    environment:
      TZ: Asia/Shanghai
      DEVICE: tun
      STACK_IP: 10.0.0.2
      STACK_MASK: 24
      TUN_NAME: tun0
      TUN_HOST_IP: 10.0.0.1
      LISTEN_ADDR: 10.0.0.2:9000
      HTTP_ADDR: :8080
      LOG_LEVEL: info
      CORS_ORIGINS: http://127.0.0.1:28471,http://localhost:28471
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "28472:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s
    restart: unless-stopped

  web:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: gostack-web
    environment:
      TZ: Asia/Shanghai
    ports:
      - "28471:80"
    depends_on:
      netstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 8
      start_period: 8s
    restart: unless-stopped

  e2e:
    profiles: ["qa"]
    image: mcr.microsoft.com/playwright:v1.49.1-jammy
    working_dir: /e2e
    environment:
      TZ: Asia/Shanghai
      BASE_URL: http://web
      API_URL: http://netstack:8080
    volumes:
      - ./tests/e2e_flow.spec.ts:/e2e/e2e_flow.spec.ts:ro
      - ./tests/playwright.config.ts:/e2e/playwright.config.ts:ro
      - ./tests/package.json:/e2e/package.json:ro
    depends_on:
      web:
        condition: service_healthy
      netstack:
        condition: service_healthy
    entrypoint: ["bash", "-lc"]
    command:
      - "npm install --no-fund --no-audit && npx playwright test"
